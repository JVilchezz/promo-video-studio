name: Release skill zip
# Push a tag like v1.0.0 → builds promo-video-studio.zip (ready for Claude.ai → Customize → Skills → Upload)
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build skill zip
        run: cd plugins/promo-video-studio/skills && zip -r ../../../promo-video-studio.zip promo-video-studio -x '*/__pycache__/*'
      - uses: softprops/action-gh-release@v2
        with:
          files: promo-video-studio.zip
          generate_release_notes: true

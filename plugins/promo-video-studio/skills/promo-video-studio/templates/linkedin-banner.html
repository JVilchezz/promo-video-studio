<!doctype html><html><head><meta charset="utf-8">
<!-- LinkedIn banner 1584×396. Render: render.py frame mode is not needed — screenshot with Playwright at
     device_scale_factor 2 (→ 3168×792):  python3 SKILL_DIR/scripts/render.py banner.html frame 0 --w 1584 --h 396 --scale 2
     Keep x 56–360 / y 212–396 EMPTY: the profile photo covers it. Duplicate per team member. -->
<meta name="pvs-size" content="1584x396">
<link rel="stylesheet" href="pvs/base.css">
<style>
html,body{width:1584px;height:396px}
:root{--dark:#12348F;--dark2:#0A1F5C;--light:#FAF4EC;--accent:#F2C352;--accent2:#C44C3F;--accent3:#7A9862}
body{position:relative;background:radial-gradient(90% 140% at 70% 30%,#1D45AE 0%,var(--dark) 45%,var(--dark2) 100%)}
.dots{position:absolute;inset:0;background-image:radial-gradient(rgba(250,244,236,.10) 1.5px,transparent 1.6px);background-size:26px 26px;-webkit-mask-image:linear-gradient(90deg,transparent 0%,#000 30%,#000 60%,transparent 100%)}
.tag{display:inline-flex;align-items:center;gap:8px;padding:7px 16px;border-radius:999px;font-weight:600;font-size:15px;margin-right:10px}
.tag svg{width:16px;height:16px}
</style></head><body>
<div class="dots"></div>
<div style="position:absolute;left:1080px;top:-160px;width:620px;height:620px;border-radius:50%;background:radial-gradient(circle,rgba(242,193,78,.28),rgba(242,193,78,0) 62%)"></div>
<div style="position:absolute;left:0;bottom:0;width:1584px;height:6px;background:linear-gradient(90deg,var(--accent2) 0 25%,var(--accent) 25% 50%,var(--accent3) 50% 75%,var(--light) 75% 100%)"></div>
<div style="position:absolute;left:420px;top:62px">
 <div style="font-family:Display;font-size:20px;letter-spacing:6px;color:var(--accent)">{{PROGRAM}} · {{SCHOOL OR COMPANY}}</div>
 <!-- 58px for names up to ~22 characters; 52px / 48px for longer ones. The text must end before x≈1140. -->
 <div id="name" style="font-weight:700;font-size:58px;color:var(--light);line-height:1.1;margin-top:10px;letter-spacing:-.01em">{{FULL NAME}}</div>
 <div style="font-weight:500;font-size:21px;color:#C9D3EC;margin-top:10px">{{ROLE}} · <b style="color:var(--light)">{{PRODUCT}}</b></div>
 <div style="margin-top:22px">
  <span class="tag" style="background:var(--light);color:var(--dark)">{{SKILL 1}}</span><span class="tag" style="background:var(--accent);color:var(--dark)">{{SKILL 2}}</span><span class="tag" style="background:var(--accent3);color:var(--light)">{{SKILL 3}}</span><span class="tag" id="store" style="background:rgba(250,244,236,.12);color:var(--light);border:1px solid rgba(250,244,236,.3)"></span>
 </div>
</div>
<!-- product visuals on the right: phone screenshots (tilted), mascot, logo -->
<div style="position:absolute;left:1250px;top:80px;width:170px;height:350px;border-radius:28px;background:#111;border:6px solid #111;transform:rotate(-8deg);box-shadow:0 20px 40px rgba(0,0,0,.4)"><div style="width:100%;height:100%;border-radius:22px;background:linear-gradient(#EEF2FB,#fff)"></div></div>
<div style="position:absolute;left:1375px;top:45px;width:195px;height:400px;border-radius:30px;background:#111;border:6px solid #111;transform:rotate(6deg);box-shadow:0 20px 40px rgba(0,0,0,.4)"><div style="width:100%;height:100%;border-radius:24px;background:linear-gradient(#FAF4EC,#fff)"></div></div>
<script src="pvs/motion.js"></script>
<script>
document.getElementById('store').innerHTML=ICONS.apple+' On the App Store';
window.R=function(){}; window.READY=true;
</script>
</body></html>

<!doctype html><html><head><meta charset="utf-8">
<meta name="pvs-size" content="1080x1920">
<!-- Example: presentation opening "dynamic" — a relatable chat + the app's notification (fictional brand). -->
<link rel="stylesheet" href="pvs/base.css">
<style>
html,body{width:1080px;height:1920px}
:root{--dark:#1F3480;--dark2:#0B1A4A;--light:#FAF4EC;--accent:#F2C352;--accent2:#C9573F;--ink:#1F3480}
.phone{transform-origin:50% 0}
</style></head><body>

<div class="S paper" id="s1">
 <div class="c D" id="k" style="top:150px;font-size:34px;color:var(--accent2);letter-spacing:10px">A TYPICAL TUESDAY, 12:05</div>
 <div class="phone" id="ph" style="left:240px;top:250px;width:600px;height:1300px;border-radius:90px;padding:16px">
  <div class="screen" style="width:568px;height:1268px;border-radius:76px"><div id="chat" style="width:420px;height:939px;zoom:1.35"></div></div></div>
</div>

<div class="S dark" id="s2">
 <div id="g" style="position:absolute;left:40px;top:410px;width:1000px;height:1000px;border-radius:50%;background:radial-gradient(circle,rgba(242,193,78,.35),rgba(242,193,78,0) 62%)"></div>
 <img id="ic" src="assets/appicon.png" style="position:absolute;left:400px;top:560px;width:280px;height:280px;border-radius:64px;box-shadow:0 30px 60px rgba(0,0,0,.35)">
 <div class="c D" id="t1" style="top:900px;font-size:130px;color:var(--light)">NO MORE LINES.</div>
 <div class="c H" id="t2" style="top:1060px;font-size:84px;color:var(--accent)"><span class="w">order ahead with Aurora</span></div>
</div>

<script src="pvs/motion.js"></script>
<script>
const W=1080,H=1920,END=16;
const SC=[{id:'s1',start:0,end:12.4},{id:'s2',start:12.4,end:16}];
const MSGS=[[0,'them','Ready for the exam tomorrow?','21:14'],[0,'me','Almost. See you at lunch!','21:15'],[0.9,'me','Are you at the cafeteria yet?','12:05'],[2.9,'them','Yes, but the line is huge.','12:05'],
            [4.9,'me','Can you save me a spot? I’m just leaving class.','12:06'],[7.1,'them','Way too many people. Impossible.','12:06'],
            [9.1,'me','Then I’m missing lunch again.','12:07']];
const TYPING=[[1.9,2.9],[6.0,7.1]];
const NOTIF={t:10.6,app:'AURORA',icon:'assets/appicon.png',title:'Order ready',body:'Your lunch is waiting. Show your code at the counter.'};
const C=chatUI('chat',{name:'Daniela',avatar:'D',time:'12:05',lang:'en'});
overlays({W,H,grain:.045});
ready(['assets/appicon.png']);
window.R=function(t){
  const cur=scenes(SC,t);
  if(t<13.2){ rise('k',t,.3,20); const a=ease.out4(t/1.0); $('ph').style.transform=`translateY(${(1-a)*200-6*Math.sin(t*1.1)}px)`; $('ph').style.opacity=cl(t/.4);
    C.update(t,MSGS,TYPING,NOTIF); }
  if(t>=12.4){ $('g').style.opacity=ease.out4((t-12.5)/1.2); pop('ic',t,12.6,.7,60); rise('t1',t,13.2,50); write('t2',t,13.9,1.3); }
  atmosphere(t,{cuts:[0,12.4],dark:cur==='s2',end:END,leaks:cur==='s2'});
};
</script></body></html>
